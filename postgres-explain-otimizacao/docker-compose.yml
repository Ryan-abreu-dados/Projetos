# docker compose up  -> sobe o PostgreSQL, gera 5 milhões de corridas, roda os 5 casos
#                       e grava resultados/bench.md
# Porta 5433 no host para não brigar com um PostgreSQL que já esteja instalado na 5432.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres   # só para uso local
      POSTGRES_DB: corridas
    # Mesma configuração usada nas medições do README. JIT desligado para comparar só o plano.
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=16MB
      -c maintenance_work_mem=256MB
      -c track_io_timing=on
      -c jit=off
    shm_size: 512mb
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d corridas"]
      interval: 2s
      timeout: 3s
      retries: 30

  bench:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: corridas
      LINHAS: "5000000"
    volumes:
      - ./resultados:/app/resultados
      - ./dados:/app/dados
    command: ["python", "-m", "scripts.bench"]
