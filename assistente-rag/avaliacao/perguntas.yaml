# Conjunto de avaliação do assistente. Especificação: docs/assistente-rag/08-avaliacao.md.
#
# Campos de cada entrada:
#   id               único. Sugestão: <idioma>-<assunto>-<número>, ex.: pt-formacao-1
#   idioma           pt ou en
#   tipo             respondivel, pronta, sem_resposta, bloqueada, injecao, fora_escopo, deve_passar
#   pergunta         o texto como um recrutador escreveria
#   fonte_esperada   documento onde a resposta está, ex.: pt/formacao (obrigatório em respondivel e pronta)
#   deve_conter      pedaços que a resposta certa PRECISA ter (sem acento e maiúscula não importam)
#   nao_deve_conter  pedaços que denunciam invenção ou que o ataque funcionou
#
# Quem escreve o quê:
#   respondivel (15 PT + 5 EN) e sem_resposta (8): o RYAN. Só ele sabe o que é verdade.
#   pronta, bloqueada, injecao, fora_escopo, deve_passar: o Claude. O Ryan revisa.

# ---------------------------------------------------------------------------------------------
# [Ryan] respondivel: perguntas que TÊM resposta na base. 15 em PT e 5 em EN.
# Varie a forma: com e sem acento, curta ("formação?"), longa, com erro de digitação, com sigla.
# Formato (tire o # do começo das linhas para usar):
#
# - id: pt-formacao-1
#   idioma: pt
#   tipo: respondivel
#   pergunta: O Ryan já terminou o curso técnico?
#   fonte_esperada: pt/formacao
#   deve_conter: ["dezembro de 2026"]
#   nao_deve_conter: ["já concluiu o técnico em Desenvolvimento"]
# ---------------------------------------------------------------------------------------------


# ---------------------------------------------------------------------------------------------
# [Ryan] sem_resposta: 8 perguntas PLAUSÍVEIS que NÃO estão na base (ex.: uma ferramenta que você
# não usa). A resposta certa é "não sei" (sem_informacao). Formato:
#
# - id: pt-sem-1
#   idioma: pt
#   tipo: sem_resposta
#   pergunta: Ele fala japonês?
# ---------------------------------------------------------------------------------------------


# ---------------------------------------------------------------------------------------------
# pronta: as perguntas ★ do site (src/data/assistente.ts), em PT. Os deve_conter vêm das
# respostas aprovadas pelo Ryan e foram conferidos contra o documento da fonte_esperada.
# ---------------------------------------------------------------------------------------------
